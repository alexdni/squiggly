[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

[program:postgresql]
command=/bin/bash -c "exec $(ls -d /usr/lib/postgresql/*/bin/postgres | head -1) -D /data/postgres"
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql-error.log
environment=PGDATA="/data/postgres"

[program:nextjs]
command=npm start
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/nextjs.log
stderr_logfile=/var/log/supervisor/nextjs-error.log
environment=NODE_ENV="production",PORT="3000",DEPLOYMENT_MODE="docker",DATABASE_MODE="postgres",STORAGE_MODE="local",AUTH_MODE="local",DATABASE_URL="postgresql://squiggly:squiggly@localhost:5432/squiggly",STORAGE_PATH="/data/storage"

[program:admin-setup]
command=/bin/bash -c "sleep 10 && node /app/scripts/create-admin.js"
autostart=true
autorestart=false
startsecs=0
priority=40
stdout_logfile=/var/log/supervisor/admin-setup.log
stderr_logfile=/var/log/supervisor/admin-setup-error.log
environment=DATABASE_URL="postgresql://squiggly:squiggly@localhost:5432/squiggly"

[eventlistener:supervisor_events]
command=/bin/bash -c "while read line; do echo $line; done"
events=PROCESS_STATE
buffer_size=10
